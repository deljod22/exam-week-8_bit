start:{k:"Polite refusal",t:"Monday, 7:40 a.m. Your final English exam is in five days. Your friend Mia texts: “All-night study session at my place tonight? Everyone’s coming.” You’re tired and a little overwhelmed.",q:"Which reply politely declines and suggests an alternative?",o:["No, I can’t. I have other things.","I’d love to, but I’m wiped out. Could we do a shorter session tomorrow instead?","I am not agree with this plan.","Maybe I come, maybe not."],a:1,w:"B softens the refusal (“I’d love to, but…”) and offers an alternative. A is blunt, C contains the typical “I am agree” error, and D is vague and ungrammatical.",c:[["Join the all-night session anyway","night",3],["Go to bed early","sleep",0],["Make a revision plan for the week","plan",1]]},
night:{k:"Collocation: back up",t:"Tuesday. You’ve had three hours of sleep. In class, Mr Huber hands back your practice essay with a note: “Interesting ideas, but you need to ___ your claims with concrete examples.”",q:"Which phrasal verb completes the note?",o:["back out","back up","back off","back down"],a:1,w:"To back up a claim means to support it with evidence. Back out = withdraw from an agreement, back off = retreat, back down = give in.",c:[["Drink three coffees and keep cramming","mock",3],["Ask Mr Huber for advice after class","teacher",0]]},
sleep:{k:"Get vs become",t:"Tuesday. You slept eight hours and feel sharp. In the class chat, someone asks how you’re coping with the stress.",q:"Which message is correct English?",o:["I became enough sleep, so I feel fine.","I got enough sleep, so I feel fine.","I have got become enough sleep, so I feel fine.","I made enough sleep, so I feel fine."],a:1,w:"German “bekommen” = get (or receive), not become. “Become” translates “werden”.",c:[["Revise vocabulary with a quiz","mock",1],["Practise speaking with a classmate","oral",1]]},
plan:{k:"Formal register",t:"Tuesday. Your plan is stuck on the wall: writing on Wednesday, speaking on Thursday. Today’s task is the introduction to a practice essay on school.",q:"Which sentence suits a formal essay best?",o:["Lots of kids think school is a waste of time.","Many young people question the value of formal schooling.","Loads of teens reckon school is rubbish.","School is totally pointless, to be honest."],a:1,w:"B uses neutral, formal vocabulary (“young people”, “question the value of”). The others are colloquial or too absolute for an essay.",c:[["Do a timed practice essay","mock",2],["Practise speaking with a classmate","oral",1]]},
teacher:{k:"Polite request",t:"Mr Huber has a few minutes after class. You want help with how to structure your essay.",q:"Which request sounds most polite and natural?",o:["Tell me what to do.","I was wondering if you could give me some advice on how to structure my essay.","Give me advice, please.","You must help me with the essay."],a:1,w:"“I was wondering if you could…” is a classic indirect request. The others are too direct or sound like orders.",c:[["Do a timed practice essay","mock",1],["Prepare for the speaking part","oral",1]]},

oral:{k:"Speculating",t:"Thursday. Speaking practice. Your partner holds up a photo: a student alone at a desk at night, laptop open, empty cups around.",q:"Which answer speculates best?",o:["He is surely very stressed, I know it.","He might be preparing for an exam. It looks as if he has been studying for hours.","He will be a hacker.","He is studying because it is night."],a:1,w:"Speculation needs hedging: “might be”, “it looks as if”. A and C sound too certain, and D states a weak reason as fact.",c:[["Record yourself and listen back","exam",1],["Do one more practice round","exam",2]]},
exam:{k:"Paraphrasing",t:"Friday. The real exam. In the speaking part you suddenly forget the English word for “Lehrplan”.",q:"What is the best strategy?",o:["Say: “Sorry, I don’t know the word.”","Stay silent until you remember it.","Ask: “Wie sagt man Lehrplan auf Englisch?”","Say: “It’s the official plan that says what schools have to teach. I can’t think of the exact word.”"],a:3,w:"Paraphrasing keeps you speaking in English and shows range, which examiners reward. The other options stop the conversation or switch language.",c:[["Take a deep breath and finish the exam","end",0]]}

GM.quiz=function(){Q={lvl:2,streak:0,best:0,score:0,n:0,right:0,used:{},cur:null};qNext()};
function qNext(){if(Q.n>=10)return qEnd();var q,i=-1;if(Math.random()<.35)q=vq();else{i=qpick();if(i<0)q=vq();else{Q.used[i]=1;q=B[i]}}Q.cur={q:q,order:shuf([0,1,2,3])};hud();scr('<div class="stats"><span class="px">Q'+(Q.n+1)+'/10</span><span class="tag">'+LV[Q.lvl]+'</span><span class="px'+(Q.streak>2?" hot":"")+'">STREAK '+Q.streak+'</span><span class="px">PTS '+Q.score+'</span></div>'+(G.mode==="solo"?"":'<p class="px">'+esc(nm())+' ANSWERS. TEAM STREAK!</p>')+'<div class="panel"><p class="q">'+q[1]+'</p>'+Q.cur.order.map(function(oi){return '<button class="btn opt" data-a="qans" data-v="'+oi+'">'+q[2][oi]+'</button>'}).join("")+'<div class="fb" id="qfb" hidden></div><button class="btn" data-a="qnx" id="nx" hidden>Next</button></div>')}
ACT.qans=function(v,t){var q=Q.cur.q,ok=+v===q[3],g=nm(),p=me(g),x=0;document.querySelectorAll("[data-a=qans]").forEach(function(b){b.disabled=true;if(+b.dataset.v===q[3])b.classList.add("ok")});if(!ok)t.classList.add("no");Q.n++;p.qa++;if(ok){Q.streak++;Q.best=Math.max(Q.best,Q.streak);p.best=Math.max(p.best,Q.streak);p.qc++;Q.right++;x=q[0]*10+Math.min(Q.streak,5)*2;Q.score+=x;if(Q.streak%2===0&&Q.lvl<3)Q.lvl++}else{Q.streak=0;if(Q.lvl>1)Q.lvl--}give(g,x||1);var f=$("#qfb");f.className="fb "+(ok?"ok":"no");f.hidden=false;f.textContent=(ok?"Correct! +"+x+" XP. ":"Not quite. ")+q[4];$("#nx").hidden=false;$("#nx").textContent=Q.n>=10?"Results":"Next"};
ACT.qnx=function(){G.turn++;qNext()};
function qEnd(){var tip=Q.right>=8?"Excellent. You’re ready for C1-level tasks.":Q.right>=5?"Good. Review the explanations of the ones you missed.":"Keep practising. Replay and read the explanations.";scr('<h1>ROUND COMPLETE</h1><div class="panel"><p class="big">'+Q.right+'/10 correct</p><p>'+(G.mode==="solo"?"":"Team ")+'score '+Q.score+' · best streak '+Q.best+' · final level '+LV[Q.lvl]+'</p><p>'+tip+'</p></div><button class="btn" data-a="play" data-v="quiz">Play again</button><button class="btn" data-a="menu">Games</button>')}

/* ---- online team quiz (PeerJS, host is authoritative) ---- */
var NETMSG="Could not reach the matchmaking server. Online play needs internet, and school Wi-Fi or the claude.ai preview can block it.";
function cleanAv(a){var o={};CAT.forEach(function(c){o[c[0]]=Math.max(0,Math.min(c[2].length-1,+(a&&a[c[0]])||0))});return o}
function cleanP(l){return(Array.isArray(l)?l:[]).slice(0,6).map(function(p){return{name:String(p&&p.name||"Player").slice(0,12),av:cleanAv(p&&p.av)}})}
function newCode(){var c="",a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";for(var i=0;i<4;i++)c+=a[Math.random()*a.length|0];return c}
function uniq(n){var s=String(n||"Player").slice(0,12),b=s,k=2;while(N.players.some(function(p){return p.name===s}))s=b.slice(0,10)+" "+k++;return s}
function bcast(m){Object.keys(N.conns).forEach(function(k){try{N.conns[k].send(m)}catch(e){}})}
function reset(){var p=N.peer;N={on:0,players:[],conns:{}};try{p&&p.destroy()}catch(e){}}
function netFail(msg){reset();hud();scr('<h1>ONLINE</h1><div class="panel"><p>'+esc(msg)+'</p></div><button class="btn" data-a="online">Back</button><button class="btn" data-a="home">Menu</button>')}
function perr(e){netFail(e&&e.type==="peer-unavailable"?"Room not found. Check the code and try again.":NETMSG)}
ACT.online=function(){G.mode="online";G.sel=(DB.last||[]).filter(function(n){return DB.p[n]}).slice(0,1);chars()};
function lobbyMenu(){G.names=[G.me];reset();hud();scr('<h1>ONLINE TEAM QUIZ</h1><p class="sub">Everyone answers on their own device and the team shares one streak. Needs internet.</p><div class="crew"><div>'+AVS(G.me,4)+'<div class="px">'+esc(G.me)+'</div></div></div><button class="btn big" data-a="host">Host a room<br><span class="d">You get a 4-letter code to share.</span></button><p class="px">OR JOIN A ROOM</p><input class="in" id="jc" maxlength="4" placeholder="CODE"><button class="btn" data-a="join">Join</button><button class="btn" data-a="online">Change character</button><button class="btn" data-a="home">Back</button>')}
function lobbyScreen(){hud();scr('<h1>ROOM '+esc(N.code)+'</h1><p class="sub">'+(N.host?"Share this code. Friends choose Online, then Join a room.":"Connected. Waiting for the host to start.")+'</p><div class="crew">'+N.players.map(function(p){return '<div>'+AVd(p.av,4)+'<div class="px">'+esc(p.name)+'</div></div>'}).join("")+'</div>'+(N.host?'<button class="btn" data-a="ostart">Start Team Quiz</button>':"")+'<button class="btn" data-a="leave">Leave</button>')}
function bcastLobby(){bcast({t:"lobby",code:N.code,players:N.players.map(function(p){return{name:p.name,av:p.av}})});lobbyScreen()}
ACT.host=function(){if(typeof Peer==="undefined")return netFail(NETMSG);var tries=0;(function go(){var code=newCode(),p=new Peer("exw8-"+code);N.peer=p;p.on("open",function(){clearTimeout(N.to);N.on=1;N.host=1;N.code=code;N.started=0;N.players=[{id:"host",name:G.me,av:av(G.me)}];N.conns={};N.nm=G.me;lobbyScreen()});p.on("error",function(e){if(e&&e.type==="unavailable-id"&&tries++<5){try{p.destroy()}catch(x){}go()}else{clearTimeout(N.to);perr(e)}});p.on("connection",hostConn)})();N.to=setTimeout(function(){if(!N.on)netFail(NETMSG)},12000)};
function hostConn(c){c.on("data",function(m){if(!m||typeof m!=="object")return;if(m.t==="join"){if(N.started||N.players.length>=6){c.send({t:"full"});return}var pl={id:c.peer,name:uniq(m.name),av:cleanAv(m.av)};N.players.push(pl);N.conns[c.peer]=c;c.send({t:"hi",name:pl.name});bcastLobby()}else if(m.t==="ans")hostAnswer(c.peer,m.i)});c.on("close",function(){drop(c.peer)})}
function drop(id){var k=N.players.findIndex(function(p){return p.id===id});if(k<0)return;N.players.splice(k,1);delete N.conns[id];if(!N.started)bcastLobby();else{hud();var c=Q&&Q.cur;if(c&&c.open&&N.players.length&&N.players.every(function(p){return c.ans[p.id]!==undefined}))hostResult()}}
ACT.join=function(){var code=($("#jc").value||"").trim().toUpperCase();if(code.length!==4)return;if(typeof Peer==="undefined")return netFail(NETMSG);var p=new Peer();N.peer=p;N.host=0;N.nm=G.me;p.on("error",perr);p.on("open",function(){var c=p.connect("exw8-"+code,{reliable:true});N.hc=c;c.on("open",function(){c.send({t:"join",name:G.me,av:av(G.me)})});c.on("data",function(m){try{guestMsg(m)}catch(e){}});c.on("close",function(){if(N.hc===c)netFail("The connection to the host was lost.")})});N.to=setTimeout(function(){if(!N.on)netFail("Could not join. The code may be wrong, or your network blocks online play.")},12000)};
function guestMsg(m){if(!m||typeof m!=="object")return;
if(m.t==="hi")N.nm=String(m.name).slice(0,12);
else if(m.t==="lobby"){clearTimeout(N.to);N.on=1;N.code=String(m.code||"").slice(0,4);N.players=cleanP(m.players);N.started=0;lobbyScreen()}
else if(m.t==="full")netFail("This room is full or already playing.");
else if(m.t==="q")onQ({n:+m.n||1,text:String(m.text),opts:(Array.isArray(m.opts)?m.opts:[]).slice(0,4).map(String),lvl:+m.lvl||2,streak:+m.streak||0,score:+m.score||0});
else if(m.t==="res")onRes({r:m.r&&typeof m.r==="object"?m.r:{},right:String(m.right),why:String(m.why),streak:+m.streak||0,score:+m.score||0,n:+m.n||0,team:!!m.team});
else if(m.t==="end")onEnd({score:+m.score||0,best:+m.best||0,right:+m.right||0})}
ACT.leave=function(){reset();start()};
ACT.ostart=function(){if(!N.host)return;N.started=1;Q={lvl:2,streak:0,best:0,score:0,n:0,right:0,used:{},cur:null};hostNext()};
function hostNext(){if(Q.n>=10){var e={t:"end",score:Q.score,best:Q.best,right:Q.right};bcast(e);return onEnd(e)}
var q,i=-1;if(Math.random()<.35)q=vq();else{i=qpick();if(i<0)q=vq();else{Q.used[i]=1;q=B[i]}}
var order=shuf([0,1,2,3]);Q.cur={q:q,order:order,ans:{},open:1};
var m={t:"q",n:Q.n+1,text:q[1],opts:order.map(function(oi){return q[2][oi]}),lvl:Q.lvl,streak:Q.streak,score:Q.score};
bcast(m);onQ(m);Q.cur.to=setTimeout(hostResult,21000)}
function hostAnswer(id,i){var c=Q.cur;i=+i;if(!c||!c.open||c.ans[id]!==undefined||!(i>=0&&i<4&&i===(i|0)))return;c.ans[id]=i;if(N.players.every(function(p){return c.ans[p.id]!==undefined}))hostResult()}
function hostResult(){var c=Q.cur;if(!c||!c.open)return;c.open=0;clearTimeout(c.to);var q=c.q,r={},ok=0,np=N.players.length;
N.players.forEach(function(p){var a=c.ans[p.id],g=a!==undefined&&c.order[a]===q[3];r[p.name]={ok:g};if(g)ok++});
var team=ok*2>np;Q.n++;if(team){Q.streak++;Q.best=Math.max(Q.best,Q.streak);Q.right++;if(Q.streak%2===0&&Q.lvl<3)Q.lvl++}else{Q.streak=0;if(Q.lvl>1)Q.lvl--}
var tot=0;N.players.forEach(function(p){var o=r[p.name];o.gain=o.ok?q[0]*10+Math.min(Q.streak,5)*2:0;tot+=o.gain});Q.score+=tot;
var m={t:"res",r:r,right:q[2][q[3]],why:q[4],streak:Q.streak,score:Q.score,lvl:Q.lvl,n:Q.n,team:team};bcast(m);onRes(m)}
function onQ(m){N.my=null;hud();scr('<div class="stats"><span class="px">Q'+m.n+'/10</span><span class="tag">'+LV[m.lvl]+'</span><span class="px'+(m.streak>2?" hot":"")+'">TEAM STREAK '+m.streak+'</span><span class="px">TEAM '+m.score+'</span></div><div class="panel"><p class="px" id="tm">20</p><p class="q">'+esc(m.text)+'</p>'+m.opts.map(function(o,i){return '<button class="btn opt" data-a="oans" data-v="'+i+'">'+esc(o)+'</button>'}).join("")+'<div class="fb" id="qfb" hidden></div><div id="res"></div></div>');timer(20,function(){})}
ACT.oans=function(v,t){document.querySelectorAll("[data-a=oans]").forEach(function(b){b.disabled=true});t.classList.add("on");N.my=+v;var f=$("#qfb");f.className="fb";f.hidden=false;f.textContent="Answer locked. Waiting for the others…";if(N.host)hostAnswer("host",+v);else N.hc.send({t:"ans",i:+v})};
function onRes(m){clearInterval(T);var my=m.r[N.nm],g=my&&my.ok?Math.max(0,+my.gain||0):0,ok=!!(my&&my.ok);
document.querySelectorAll("[data-a=oans]").forEach(function(b){b.disabled=true;if(b.textContent===m.right){b.classList.remove("on");b.classList.add("ok")}else if(b.classList.contains("on")){b.classList.remove("on");b.classList.add("no")}});
var p=me(G.me);p.qa++;if(ok){p.qc++;p.best=Math.max(p.best,m.streak)}give(G.me,g||1);
var f=$("#qfb");f.className="fb "+(ok?"ok":"no");f.hidden=false;f.textContent=(ok?"Correct! +"+g+" XP. ":N.my==null?"Time’s up. ":"Not quite. ")+m.why;
$("#res").innerHTML='<p class="px">'+(m.team?"TEAM POINT!":"NO TEAM POINT")+' · STREAK '+m.streak+'</p>'+Object.keys(m.r).map(function(k){return '<span class="tag">'+(m.r[k]&&m.r[k].ok?"✔ ":"✘ ")+esc(k)+'</span> '}).join("")+(N.host?'<br><button class="btn" data-a="onext">'+(m.n>=10?"Results":"Next question")+'</button>':'<p class="sub">Waiting for the host…</p>')}
ACT.onext=function(){hostNext()};
function onEnd(m){scr('<h1>TEAM RESULT</h1><div class="panel"><p class="big">'+m.right+'/10 team points</p><p>Team score '+m.score+' · best team streak '+m.best+'</p></div>'+(N.host?'<button class="btn" data-a="olobby">Play again</button>':'<p class="sub">Waiting for the host to start another round…</p>')+'<button class="btn" data-a="leave">Leave</button>')}
ACT.olobby=function(){if(!N.host)return;N.started=0;bcastLobby()};

start();
</script>
